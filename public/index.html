<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Radio Death Metal Suomi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Pirata+One&family=Oswald:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="is-radio">
    <!-- photocopy / toner / grain texture layers (pure CSS, black & white) -->
    <div class="grain" aria-hidden="true"></div>
    <div class="halftone" aria-hidden="true"></div>
    <div class="streak" aria-hidden="true"></div>

    <main class="sheet">
      <!-- brand lockup: RADIO · [DEATH METAL] · SUOMI -->
      <header class="lockup">
        <p class="line line-top"><span>Radio</span></p>
        <h1 class="mark" data-text="Death Metal">Death Metal</h1>
        <p class="line line-bot"><span>Suomi</span></p>
      </header>

      <!-- live state -->
      <section class="console" aria-label="Now broadcasting">
        <div id="mode" class="mode radio">Radio</div>

        <div class="now">
          <span class="now-tag">Now playing</span>
          <div class="now-window">
            <div id="nowPlaying" class="now-track">— silence —</div>
          </div>
        </div>
      </section>

      <!-- exactly two controls -->
      <nav class="controls" aria-label="Playback">
        <button id="playBtn" class="btn" type="button">
          <span class="btn-glyph" aria-hidden="true">&#9654;</span>
          <span class="btn-text">Play</span>
        </button>
        <button id="stopBtn" class="btn" type="button">
          <span class="btn-glyph" aria-hidden="true">&#9632;</span>
          <span class="btn-text">Stop</span>
        </button>
      </nav>
    </main>

    <!-- required, hidden engine elements -->
    <div id="ytHost" aria-hidden="true"></div>
    <audio id="radio" preload="none"></audio>

    <script src="app.js"></script>
  </body>
</html>
